[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fta-router"
version = "0.1.0"
description = "FT-first hybrid behavioural router: answer_small | rag | tools | escalate_large"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Vijay Kumar", email = "vijaykumarjob0701@gmail.com" },
]
keywords = [
  "routing",
  "behavioural-router",
  "llm",
  "rag",
  "tools",
  "fine-tuning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
]
train = [
  "torch>=2.0",
  "transformers>=4.36",
  "datasets>=2.16",
  "accelerate>=0.25",
]

[project.urls]
Homepage = "https://github.com/vijaykumarjob0701/fta-router"
Documentation = "https://github.com/vijaykumarjob0701/fta-router"
Repository = "https://github.com/vijaykumarjob0701/fta-router"
Issues = "https://github.com/vijaykumarjob0701/fta-router/issues"
"Paper companion" = "https://github.com/vijaykumarjob0701/ft-behavioral-router"

[project.scripts]
fta-router = "fta_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fta_router = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
